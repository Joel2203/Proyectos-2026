<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h2>Compra de prodcutos</h2>
        <fieldset>
            <legend>Detalles de la compra</legend>
        <div>
            <input list="articulo" placeholder="Prodcuto que desea comprar">
            <datalist id="articulo">
                <option value="25$">Taza de cafe</option>
                <option value="50$">Bolsa de granos de cafe</option>
                <option value="100$">Capacitacion para aprender a ahcer cafe</option>
            </datalist>
        </div>
        <div>
            <input type="number" placeholder="Cantidad de productos a comprar">
            <input type="text" placeholder="Coloque su nombre">
            <input type="email" placeholder="coloque su correo">
        </div>
        </fieldset>
    </form>
</body>
</html>
